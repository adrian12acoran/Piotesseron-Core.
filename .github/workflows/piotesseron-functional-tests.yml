name: Piotesseron Functional Tests

on:
  push:
    branches:
      - main
    paths:
      - "piotesseron_core.py"
      - "tests/**"
      - ".github/workflows/piotesseron-functional-tests.yml"

  pull_request:
    branches:
      - main
    paths:
      - "piotesseron_core.py"
      - "tests/**"
      - ".github/workflows/piotesseron-functional-tests.yml"

  workflow_dispatch:

jobs:
  functional-tests:
    name: Test Piotesseron Decision Architecture

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pytest

      - name: Check Piotesseron syntax
        run: |
          python -m py_compile piotesseron_core.py
          python -m py_compile tests/test_piotesseron.py

      - name: Run Piotesseron functional tests
        run: |
          python -m pytest tests/test_piotesseron.py -v
